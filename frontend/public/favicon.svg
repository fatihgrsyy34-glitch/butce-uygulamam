<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161D27"/>
      <stop offset="1" stop-color="#0F141B"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B0894A"/>
      <stop offset="0.55" stop-color="#CBA25C"/>
      <stop offset="1" stop-color="#DCB877"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#CBA25C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#CBA25C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ink)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Yükselen çubuklar — App.jsx'teki "yatirimlar"/"grafikler" ikon diliyle aynı -->
  <g fill="url(#brass)">
    <rect x="116" y="300" width="52" height="100" rx="14"/>
    <rect x="192" y="250" width="52" height="150" rx="14"/>
    <rect x="268" y="200" width="52" height="200" rx="14"/>
    <rect x="344" y="150" width="52" height="250" rx="14"/>
  </g>

  <!-- Taban çizgisi -->
  <rect x="116" y="416" width="280" height="10" rx="5" fill="#CBA25C" opacity="0.32"/>
</svg>
