# Render bedava katmanı sunucuyu 15 dk boşta kalırsa uyutuyor; uyanması
# ~22 sn sürüyor, yani uygulamayı telefondan açmak o kadar bekletiyor.
# Bu iş /api/health ucunu düzenli çağırıp sunucuyu ayakta tutar.
#
# Ping başarısız olursa iş de başarısız olur; yani aynı zamanda bedava
# kesinti bildirimi sağlar (GitHub başarısız işlerde e-posta atar).
name: keep-alive

on:
  schedule:
    # 10 dakikada bir. GitHub zamanlaması yoğun saatlerde gecikebildiği için
    # Render'ın 15 dk eşiğinin altında pay bırakıyoruz.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backend'i uyandır
        run: |
          curl --fail --show-error --silent \
               --max-time 120 \
               --retry 3 --retry-delay 10 --retry-all-errors \
               -w "\nHTTP %{http_code} | süre: %{time_total} sn\n" \
               https://butce-uygulamam-1.onrender.com/api/health
